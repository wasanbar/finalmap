<script>
  setActiveNav();

  function kvItem(label, value){
    const div = document.createElement("div");
    div.className="item";
    div.innerHTML = `<small>${label}</small><b>${value}</b>`;
    return div;
  }

  function tourNav(tours, tourId, i, stops){
    const el = document.getElementById("navtour");
    el.innerHTML="";
    if(!tourId) return;

    // NOTE: do not shadow the translation helper `t()`
    const tourObj = tours.find(x=> x.id===tourId);
    if(!tourObj) return;

    const idx = Number(i||0);
    const prevId = idx>0 ? stops[idx-1] : null;
    const nextId = idx < stops.length-1 ? stops[idx+1] : null;

    const label = document.createElement("span");
    label.className="badge";
    label.textContent = `ضمن: ${tourObj.title_ar} — محطة ${idx+1} من ${stops.length}`;
    el.appendChild(label);

    if(prevId){
      const a = document.createElement("a");
      a.className="btn";
      a.href = `building.html?id=${prevId}&tour=${tourId}&i=${idx-1}`;
      a.textContent = t("السابق","Previous");
      el.appendChild(a);
    }
    if(nextId){
      const a = document.createElement("a");
      a.className="btn primary";
      a.href = `building.html?id=${nextId}&tour=${tourId}&i=${idx+1}`;
      a.textContent = t("التالي","Next");
      el.appendChild(a);

      // Floating next button for mobile/visibility
      const float = document.createElement("button");
      float.id = "floatingNext";
      float.className = "floating-next";
      float.textContent = t("التالي","Next") + " ⏭️";
      float.addEventListener("click", ()=>{ window.location.href = a.href; });
      document.body.appendChild(float);

    }else{
      const done = document.createElement("a");
      done.className="btn primary";
      done.href = `tours.html`;
      done.textContent = t("إنهاء الجولة","Finish tour");
      const end = document.createElement("div");
      end.className="notice";
      end.style.marginTop="10px";
      end.textContent = "الآن رأيت جزءًا من رام الله… لكن المدينة دائمًا أكبر من أي خريطة. جرّب جولة أخرى أو افتح جواز الزيارة.";
      el.appendChild(end);
      const pass = document.createElement("a");
      pass.className="btn";
      pass.href="passport.html";
      pass.textContent = t("🎟️ افتح جواز الزيارة","🎟️ Open passport");
      el.appendChild(pass);
      const again = document.createElement("a");
      again.className="btn primary";
      again.href="tours.html";
      again.textContent = t("🧭 ابدأ جولة أخرى","🧭 Start another tour");
      el.appendChild(again);

      el.appendChild(done);
    }
  }

  (async()=>{
    const id = qs("id");
    const tour = qs("tour");
    const i = qs("i");

    const buildings = await loadJSON("data/buildings.json");
    const tours = await loadJSON("data/tours.json");

    const b = buildings.find(x=> x.id===id) || buildings[0];

    document.title = `${t(b.name_ar, b.name_en)} — Ramallah Heritage`;
    document.getElementById("title").textContent = t(b.name_ar, b.name_en);
    document.getElementById("meta").textContent = (getLang()==="en") ? `${b.type_en||b.type_ar} • ${b.period_en||b.period_ar}` : `${b.type_ar} • ${b.period_ar}`;
    document.getElementById("importance").textContent = t(b.importance_ar, b.importance_en);
    // Carousel + Lightbox
    const car = document.getElementById("carousel");
    const imgs = (b.images && b.images.length) ? b.images : ["assets/img/placeholder.jpg"];
    renderCarousel(car, imgs, t(b.name_ar, b.name_en));

    const kv = document.getElementById("kv");
    kv.appendChild(kvItem(t("النوع","Type"), t(b.type_ar, b.type_en||b.type_ar)));
    kv.appendChild(kvItem(t("الفترة","Period"), t(b.period_ar, b.period_en||b.period_ar)));
    kv.appendChild(kvItem(t("الاسم","Name"), t(b.name_ar, b.name_en||b.name_ar)));
    kv.appendChild(kvItem(t("الإحداثيات","Coordinates"), `(${b.lat.toFixed(5)}, ${b.lng.toFixed(5)})`));

    const tags = document.getElementById("tags");
    (b.tags||[]).forEach(t=>{
      const s = document.createElement("span");
      s.className="badge";
      s.textContent=t;
      tags.appendChild(s);
    });

    document.getElementById("story").textContent = t(b.story_ar, b.story_en);
    document.getElementById("whyHere").textContent = t(b.why_here_ar || "—", b.why_here_en || "—");
    const deepBox = document.getElementById("deepBox");
    if(getMode()==="researcher" && (b.deep_ar || b.deep_en)){
      deepBox.style.display="block";
      deepBox.textContent = t(b.deep_ar || "", b.deep_en || "");
    }else{
      deepBox.style.display="none";
    }

    // Visited stamp (saved automatically)
    const stampBtn = document.getElementById("visitStamp");
    function renderStamp(){
      const v = isVisited(b.id);
      stampBtn.textContent = v ? t("✓ تمت الزيارة","✓ Visited") : t("○ لم تتم الزيارة","○ Not visited");
      stampBtn.classList.toggle("primary", v);
    }
    stampBtn.addEventListener("click", ()=>{
      toggleVisited(b.id);
      renderStamp();
      toast(isVisited(b.id) ? t("تم حفظ الزيارة ✅","Saved as visited ✅") : t("تم إلغاء الزيارة","Marked as not visited"));
    });
    // Auto-stamp when opened within a tour
    if(tour){ markVisited(b.id); }
    renderStamp();

    // Show quiz at the very end of the tour (one respectful question)
    if(tour){
      const tourObj = tours.find(x=>x.id===tour);
      const idx = parseInt(i||"0",10);
      if(tourObj && Array.isArray(tourObj.stops) && idx === tourObj.stops.length-1){
        setTimeout(()=> showQuizModal(tourObj.id), 500);
      }
    }
    // Actions: Google Maps, Directions, Copy GPS, Favorite, Share
    const actions = document.getElementById("actions");
    actions.innerHTML = "";

    const mapsUrl = `https://www.google.com/maps?q=${b.lat},${b.lng}`;
    const openMaps = document.createElement("a");
    openMaps.className="btn";
    openMaps.href = mapsUrl;
    openMaps.target="_blank";
    openMaps.rel="noopener";
    openMaps.textContent="🗺️ فتح على Google Maps";
    actions.appendChild(openMaps);

    const copyBtn = document.createElement("button");
    copyBtn.className="btn";
    copyBtn.type="buttonn";
    copyBtn.textContent="📌 نسخ GPS";
    copyBtn.onclick = async ()=>{
      try{
        await navigator.clipboard.writeText(`${b.lat},${b.lng}`);
        toast("تم نسخ الإحداثيات ✅");
      }catch(e){
        toast("لم أتمكن من النسخ.");
      }
    };
    actions.appendChild(copyBtn);

    const favBtn = document.createElement("button");
    favBtn.className="btn";
    favBtn.type="buttonn";
    function paintFav(){
      const on = isFav(b.id);
      favBtn.textContent = on ? "⭐ في المفضلة" : "☆ أضف للمفضلة";
      favBtn.style.borderColor = on ? "rgba(34,197,94,.55)" : "rgba(148,163,184,.18)";
    }
    favBtn.onclick = ()=>{
      const on = toggleFav(b.id);
      paintFav();
      toast(on ? "أضيفت للمفضلة ⭐" : "أزيلت من المفضلة");
    };
    paintFav();
    actions.appendChild(favBtn);

    const shareBtn = document.createElement("button");
    shareBtn.className="btn primary";
    shareBtn.type="buttonn";
    shareBtn.textContent="🔗 مشاركة";
    shareBtn.onclick = ()=> sharePage(b.name_ar, location.href);
    actions.appendChild(shareBtn);


    const vtBtn = document.createElement("a");
    vtBtn.className="btn";
    vtBtn.textContent="👓 جولة افتراضية";
    vtBtn.target="_blank";
    vtBtn.rel="noopener";
    vtBtn.href = (b.virtualTour && b.virtualTour.url) ? b.virtualTour.url : mapsUrl;
    actions.appendChild(vtBtn);

    let ambOn = false;
    const ambBtn = document.createElement("button");
    ambBtn.className="btn";
    ambBtn.type="buttonn";
    ambBtn.textContent="🌿 أجواء المدينة";
    ambBtn.onclick = ()=>{
      ambOn = !ambOn;
      if(ambOn) startAmbient("city"); else stopAmbient();
    };
    actions.appendChild(ambBtn);


    // Distance + Directions from current location (optional)
    const geoNote = document.getElementById("geoNote");
    const dirBtn = document.createElement("button");
    dirBtn.className="btn";
    dirBtn.type="buttonn";
    dirBtn.textContent="🧭 طريق الوصول (من موقعي)";
    dirBtn.onclick = async ()=>{
      try{
        toast("جاري تحديد موقعك…");
        const me = await getUserLocation();
        const km = haversineKm(me.lat, me.lng, b.lat, b.lng);
        const walkMin = Math.round((km/4.5)*60);
        geoNote.style.display="";
        geoNote.textContent = `المسافة التقريبية: ${km.toFixed(2)} كم • مشي: ~${walkMin} دقيقة`;
        const gdir = `https://www.google.com/maps/dir/?api=1&origin=${me.lat},${me.lng}&destination=${b.lat},${b.lng}&travelmode=walking`;
        window.open(gdir, "_blank", "noopener");
      }catch(e){
        geoNote.style.display="";
        geoNote.textContent = "لم يتم السماح بالموقع، أو تعذر تحديده. يمكنك فتح المبنى على Google Maps يدويًا.";
      }
    };
    actions.appendChild(dirBtn);

    const audioBtn = document.createElement("button");
    audioBtn.className="btn";
    audioBtn.type="buttonn";
    audioBtn.textContent="🔊 دليل صوتي";
    audioBtn.onclick = ()=>{
      const text = `${b.name_ar}. ${b.importance_ar}. ${b.story_ar}`;
      speak(text, "ar");
    };
    actions.appendChild(audioBtn);

    const stopBtn = document.createElement("button");
    stopBtn.className="btn";
    stopBtn.type="buttonn";
    stopBtn.textContent="⏹️ إيقاف الصوت";
    stopBtn.onclick = ()=> { stopSpeak(); toast("تم الإيقاف."); };
    actions.appendChild(stopBtn);

    const visitBtn = document.createElement("button");
    visitBtn.className="btn";
    visitBtn.type="buttonn";
    function paintVisit(){
      const on = isVisited(b.id);
      visitBtn.textContent = on ? "✅ زُرته" : "⬜ ضع علامة زيارة";
      visitBtn.style.borderColor = on ? "rgba(34,197,94,.55)" : "rgba(148,163,184,.18)";
    }
    visitBtn.onclick = ()=>{
      const on = toggleVisited(b.id);
      paintVisit();
      toast(on ? "تمت إضافة الزيارة ✅" : "تمت إزالة الزيارة");
    };
    paintVisit();
    actions.appendChild(visitBtn);




    // Tour navigation
    const stops = (tour ? (tours.find(x=>x.id===tour)?.stops || []) : []);
    tourNav(tours, tour, i, stops);

    // Media: YouTube
    const media = document.getElementById("media");

    if(b.youtube && b.youtube.length){
      const card = document.createElement("div");
      card.className="card";
      const h = document.createElement("h2");
      h.textContent="فيديو";
      const p = document.createElement("p");
      p.textContent="يمكن استبدال الفيديو لاحقًا بمقطع رسمي/توثيقي.";
      card.appendChild(h); card.appendChild(p);
      card.appendChild(document.createElement("hr")).className="sep";
      b.youtube.forEach(u=>{
        const iframe = embedYouTube(u);
        if(iframe) card.appendChild(iframe);
      });
      media.appendChild(card);
    }


    function renderBeforeAfter(container, ba){
      if(!ba || !ba.before || !ba.after) return;
      const card = document.createElement("div");
      card.className="card";
      card.style.marginTop="16px";
      card.innerHTML = `<h2>قبل / بعد</h2><p class="smallmuted">اسحب للمقارنة بين صورة قديمة وحديثة (إن توفرت).</p>`;
      const baEl = document.createElement("div");
      baEl.className="ba";
      baEl.innerHTML = `<div class="frame"><img src="${ba.before}" alt="قبل"><img class="after" src="${ba.after}" alt="بعد"></div><input type="range" min="0" max="100" value="50" />`;
      const range = baEl.querySelector("input");
      const after = baEl.querySelector(".after");
      range.addEventListener("input", ()=>{ after.style.clipPath = `inset(0 0 0 ${range.value}%)`; });
      card.appendChild(baEl);
      container.appendChild(card);
    }

    // 3D
    render3D(media, b.model3d);

    // Before/After (optional)
    renderBeforeAfter(media, b.beforeAfter);

    // Weather
    renderWeather(b.lat, b.lng);

    // Sources
    const sources = document.getElementById("sources");
    sources.innerHTML = (b.sources||[]).map(s=>`• <a href="${s.url}" target="_blank" rel="noopener">${s.label}</a>`).join("<br/>");
  })();

    // === Auto-patch: image fallback + floating tour buttons ===
    function setImgFallback(){
      document.querySelectorAll("img").forEach(im=>{
        im.addEventListener("error", ()=>{
          if(!im.dataset.fallback){
            im.dataset.fallback="1";
            im.src="assets/img/placeholder.jpg";
          }
        });
      });
    }
    setImgFallback();

    // Make tour buttons always visible on screen (in addition to inline buttons)
    (function(){
      const params = new URLSearchParams(location.search);
      const tourId = params.get("tour");
      const i = Number(params.get("i")||0);
      if(!tourId) return;

      // We already computed nextId/prevId above in tourNav(); we re-compute safely here
      Promise.all([fetch("data/tours.json").then(r=>r.json()), fetch("data/buildings.json").then(r=>r.json())]).then(([tours, buildings])=>{
        const t = tours.find(x=>x.id===tourId);
        if(!t) return;
        const stops = (t.stops||[]).map(id=> buildings.find(b=>b.id===id)).filter(Boolean);
        const prev = t.stops?.[i-1];
        const next = t.stops?.[i+1];

        // next
        if(next && !document.getElementById("floatingNext")){
          const b = document.createElement("button");
          b.id="floatingNext";
          b.className="floating-next";
          b.textContent = (params.get("lang")==="en" ? "Next" : "التالي") + " ⏭️";
          b.onclick=()=> location.href = `building.html?id=${next}&tour=${tourId}&i=${i+1}` + (params.get("lang")==="en" ? "&lang=en" : "");
          document.body.appendChild(b);
        }
        // prev
        if(prev && !document.getElementById("floatingPrev")){
          const b = document.createElement("button");
          b.id="floatingPrev";
          b.className="floating-prev";
          b.textContent = "⏮️ " + (params.get("lang")==="en" ? "Previous" : "السابق");
          b.onclick=()=> location.href = `building.html?id=${prev}&tour=${tourId}&i=${i-1}` + (params.get("lang")==="en" ? "&lang=en" : "");
          document.body.appendChild(b);
        }
      }).catch(console.error);
    })();


    // === Fix: global Prev/Next buttons (DOMContentLoaded) ===
    function bindGlobalNav(){
      const prevBtn = document.getElementById('globalPrev');
      const nextBtn = document.getElementById('globalNext');
      if(!prevBtn || !nextBtn) return;

      const params = new URLSearchParams(location.search);
      const currentId = params.get('id');
      const tourId = params.get('tour');
      const i = Number(params.get('i')||0);
      const lang = params.get('lang');

      // If we're in a tour, prefer tour order
      if(tourId){
        fetch('data/tours.json').then(r=>r.json()).then(tours=>{
          const t = tours.find(x=>x.id===tourId);
          if(!t || !Array.isArray(t.stops) || !t.stops.length) return;
          const prev = t.stops[i-1];
          const next = t.stops[i+1];
          prevBtn.disabled = !prev;
          nextBtn.disabled = !next;
          prevBtn.onclick = ()=>{ if(prev) location.href = `building.html?id=${prev}&tour=${tourId}&i=${i-1}` + (lang==='en'?'&lang=en':''); };
          nextBtn.onclick = ()=>{ if(next) location.href = `building.html?id=${next}&tour=${tourId}&i=${i+1}` + (lang==='en'?'&lang=en':''); };
        }).catch(console.error);
        return;
      }

      // Otherwise: use full buildings list
      fetch('data/buildings.json').then(r=>r.json()).then(buildings=>{
        const ids = buildings.map(b=>b.id).filter(Boolean);
        const idx = ids.indexOf(currentId);
        if(idx < 0) return;
        const prev = ids[idx-1] || null;
        const next = ids[idx+1] || null;
        prevBtn.disabled = !prev;
        nextBtn.disabled = !next;
        prevBtn.onclick = ()=>{ if(prev) location.href = `building.html?id=${prev}` + (lang==='en'?'&lang=en':''); };
        nextBtn.onclick = ()=>{ if(next) location.href = `building.html?id=${next}` + (lang==='en'?'&lang=en':''); };
      }).catch(console.error);
    }

    window.addEventListener('DOMContentLoaded', bindGlobalNav);

</script>

  <div class="global-nav" id="globalNav" aria-label="Global navigation">
    <button id="globalPrev">⏮️ السابق</button>
    <span class="hint" id="globalHint">انتقال سريع بين المعالم</span>
    <button id="globalNext" class="primary">التالي ⏭️</button>
  </div>

</body>
</html>
