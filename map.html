  <style>
    #wrap{display:grid; grid-template-columns: 380px 1fr; gap:14px}
    #map{height: calc(100vh - 140px); border-radius: 24px; overflow:hidden; border:1px solid rgba(148,163,184,.18); box-shadow: var(--shadow)}
    @media (max-width: 980px){ #wrap{grid-template-columns:1fr} #map{height:60vh} }
    .search{display:flex; gap:10px; flex-wrap:wrap}
    input[type="search"]{
      width:100%;
      padding:12px 14px;
      border-radius: 14px;
      border:1px solid rgba(148,163,184,.22);
      background: rgba(15,23,42,.55);
      color: var(--text);
      outline:none;
    }
    .list{display:flex; flex-direction:column; gap:10px; margin-top:12px}
    .rowitem{
      border:1px solid rgba(148,163,184,.18);
      background: rgba(15,23,42,.55);
      border-radius: 18px;
      padding:10px 12px;
      cursor:pointer;
    }
    .rowitem:hover{border-color: rgba(34,197,94,.45)}
    .rowitem b{display:block}
    .rowitem small{color:var(--muted)}
    .toggle{display:flex; gap:8px; align-items:center}
    .toggle input{accent-color: var(--accent)}
  
    .bldg-marker{background:rgba(15,23,42,.85);border:1px solid rgba(34,197,94,.55);border-radius:14px;box-shadow: var(--shadow);width:34px;height:34px;display:flex;align-items:center;justify-content:center}
    .bldg-marker span{font-size:18px;line-height:1}
    .leaflet-div-icon{background:transparent;border:none}
    .wxbox{margin-top:8px;padding:8px 10px;border-radius:14px;border:1px solid rgba(148,163,184,.18);background:rgba(15,23,42,.55)}
    .wxbox .t{display:flex;align-items:center;justify-content:space-between;gap:10px}
    .wxbox .t b{font-size:13px}
    .wxbox small{color:var(--muted)}
  </style>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    setActiveNav();

    let map, markers = [];
    let userLoc = null;
    let sortNearest = false;
    let buildings = [];
    let tours = [];
    let activeTour = null;

    function clearMarkers(){
      markers.forEach(m=> m.remove());
      markers = [];
    }

    function markerSymbol(typeAr){
      const t = (typeAr||'').toLowerCase();
      if(t.includes('مسجد')) return '🕌';
      if(t.includes('كنيسة')) return '⛪';
      if(t.includes('متحف')) return '🏛️';
      if(t.includes('سوق')) return '🛍️';
      if(t.includes('مكتبة')) return '📚';
      if(t.includes('مقهى')) return '☕';
      if(t.includes('حديقة')) return '🌿';
      if(t.includes('تعليم') || t.includes('مدرسة')) return '🏫';
      if(t.includes('فن')) return '🎨';
      if(t.includes('موقع') || t.includes('أثري')) return '🏺';
      if(t.includes('ساحة')) return '📍';
      if(t.includes('إطلالة')) return '🔭';
      if(t.includes('ممر') || t.includes('زقاق')) return '🧱';
      if(t.includes('مركز ثقافي') || t.includes('قصر')) return '🎭';
      if(t.includes('توقف')) return '⏸️';
      return '🏛️';
    }

    function addMarker(b){
      const icon = L.divIcon({
        className: 'bldg-marker-wrap',
        html: '<div class=\"bldg-marker\" title=\"'+(b.name_ar||'')+'\"><span>'+markerSymbol(b.type_ar)+'</span></div>',
        iconSize: [34,34],
        iconAnchor: [17,34],
        popupAnchor: [0,-34]
      });

      const popupId = `wx_${b.id}`;
      const m = L.marker([b.lat,b.lng], {icon}).addTo(map);
      m.bindPopup(`
        <b>${b.name_ar}</b><br>
        <small>${b.type_ar} — ${b.period_ar}</small>
        <div class="wxbox" id="${popupId}">
          <div class="t"><b>الطقس الآن</b><small>تحميل…</small></div>
        </div>
        <a href="building.html?id=${b.id}">افتح صفحة المبنى</a>
      `);

      m.on('popupopen', ()=> loadWeatherInto(popupId, b.lat, b.lng));
      markers.push(m);
      return m;
    }

    // Weather (Open-Meteo, no API key)
    const _wxCache = new Map();
    async function fetchWeather(lat, lng){
      const key = `${lat.toFixed(4)},${lng.toFixed(4)}`;
      if(_wxCache.has(key)) return _wxCache.get(key);
      const url = `https://api.open-meteo.com/v1/forecast?latitude=${encodeURIComponent(lat)}&longitude=${encodeURIComponent(lng)}&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m&timezone=auto`;
      const res = await fetch(url, {cache:'no-store'});
      if(!res.ok) throw new Error('wx');
      const j = await res.json();
      _wxCache.set(key, j);
      return j;
    }

    function wxText(code){
      const c = Number(code);
      if([0].includes(c)) return 'صحو';
      if([1,2,3].includes(c)) return 'غائم جزئياً';
      if([45,48].includes(c)) return 'ضباب';
      if([51,53,55].includes(c)) return 'رذاذ';
      if([56,57].includes(c)) return 'رذاذ متجمد';
      if([61,63,65].includes(c)) return 'مطر';
      if([66,67].includes(c)) return 'مطر متجمد';
      if([71,73,75].includes(c)) return 'ثلج';
      if([77].includes(c)) return 'حبّات ثلج';
      if([80,81,82].includes(c)) return 'زخات مطر';
      if([85,86].includes(c)) return 'زخات ثلج';
      if([95,96,99].includes(c)) return 'عاصفة رعدية';
      return 'طقس متغير';
    }

    async function loadWeatherInto(elId, lat, lng){
      const el = document.getElementById(elId);
      if(!el || el.dataset.loaded==='1') return;
      el.dataset.loaded='1';
      try{
        const j = await fetchWeather(lat, lng);
        const cur = (j && j.current) ? j.current : null;
        if(!cur){
          el.innerHTML = '<div class="t"><b>الطقس الآن</b><small>غير متاح</small></div>';
          return;
        }
        const t = cur.temperature_2m;
        const feels = cur.apparent_temperature;
        const wind = cur.wind_speed_10m;
        const hum = cur.relative_humidity_2m;
        const txt = wxText(cur.weather_code);
        el.innerHTML = `
          <div class="t"><b>${txt}</b><small>${t}°C</small></div>
          <small>محسوس: ${feels}°C • رياح: ${wind} كم/س • رطوبة: ${hum}%</small>
        `;
      }catch(e){
        el.innerHTML = '<div class="t"><b>الطقس الآن</b><small>تعذر التحميل</small></div>';
      }
    }

    function renderNearMe(items){
      const box = document.getElementById('nearMe');
      box.innerHTML = '';
      if(!userLoc){ box.innerHTML = '<div class="notice">اضغط “موقعي” أولاً.</div>'; return; }
      const nearest = items.slice().sort((a,b)=>haversineKm(userLoc.lat,userLoc.lng,a.lat,a.lng)-haversineKm(userLoc.lat,userLoc.lng,b.lat,b.lng)).slice(0,5);
      nearest.forEach(b=>{
        const km = haversineKm(userLoc.lat,userLoc.lng,b.lat,b.lng);
        const el = document.createElement('div');
        el.className='rowitem';
        el.innerHTML = `<b>${b.name_ar}</b><small>${km.toFixed(2)} كم • ${b.type_ar}</small>`;
        el.onclick=()=> location.href = `building.html?id=${b.id}`;
        box.appendChild(el);
      });
    }

    function renderList(items){
      const list = document.getElementById("list");
      list.innerHTML="";
      items.forEach(b=>{
        const el = document.createElement("div");
        el.className="rowitem";
        const favs = getFavs();
        const dist = userLoc ? haversineKm(userLoc.lat,userLoc.lng,b.lat,b.lng) : null;
        const distTxt = dist!=null ? ` • ${dist.toFixed(2)} كم` : '';
        const starClass = favs.has(b.id) ? 'star on' : 'star';
        const vClass = isVisited(b.id) ? 'visitedDot on' : 'visitedDot';
        el.innerHTML = `<div style="display:flex;align-items:center;justify-content:space-between;gap:10px">
          <div><b>${b.name_ar}</b><small>${b.type_ar} • ${b.period_ar}${distTxt}</small></div>
          <span class="${vClass}" title="زرتُه"></span>
          <span class="${starClass}" data-star title="مفضلة"></span>
        </div>`;
        el.onclick = ()=>{
          map.setView([b.lat,b.lng], 17, {animate:true});
          const mk = markers.find(x=> x.getLatLng().lat===b.lat && x.getLatLng().lng===b.lng);
          if(mk) mk.openPopup();
        };
        list.appendChild(el);
        const star = el.querySelector('[data-star]');
        star.addEventListener('click',(ev)=>{
          ev.stopPropagation();
          const on = toggleFav(b.id);
          star.className = on ? 'star on' : 'star';
          toast(on ? 'أضيفت للمفضلة ⭐' : 'أزيلت من المفضلة');
        });
      });
    }

    function applyFilters(){
      const q = document.getElementById("q").value.trim();
      const favOnly = document.getElementById("favOnly").checked;
      const soonOnly = document.getElementById("soonOnly").checked;
      const tourOnly = document.getElementById("tourOnly").checked;

      let items = buildings;

      if(favOnly){
        const favs = getFavs();
        items = items.filter(b=> favs.has(b.id));
      }

      if(activeTour && tourOnly){
        const ids = new Set(activeTour.stops);
        items = buildings.filter(b=> ids.has(b.id));
      }

      if(q){
        items = items.filter(b=> (b.name_ar||"").includes(q) || (b.name_en||"").toLowerCase().includes(q.toLowerCase()));
      }

      
      // sort by nearest (if we have user location)
      if(sortNearest && userLoc){
        items = items.slice().sort((a,b)=>{
          const da = haversineKm(userLoc.lat,userLoc.lng,a.lat,a.lng);
          const db = haversineKm(userLoc.lat,userLoc.lng,b.lat,b.lng);
          return da - db;
        });
      }

clearMarkers();
      if(soonOnly){
        (window._comingSoon||[]).forEach(p=>{
          const m = L.circleMarker([p.lat,p.lng], {radius:7, color:"#94a3b8", fillColor:"#94a3b8", fillOpacity:0.25}).addTo(map);
          m.bindPopup(`<b>${p.name}</b><br><small>الذاكرة دائمًا ناقصة…</small>`);
          markers.push(m);
        });
        return;
      }
      items.forEach(addMarker);
      renderList(items);

      if(items.length){
        const group = new L.featureGroup(markers);
        map.fitBounds(group.getBounds().pad(0.2));
      }
    }

    (async()=>{
      buildings = await loadJSON("data/buildings.json");
      tours = await loadJSON("data/tours.json");
      const comingSoon = await loadJSON("data/coming-soon.json");
      window._comingSoon = comingSoon;

      const tourId = qs("tour");
      if(tourId) activeTour = tours.find(t=> t.id === tourId);

      map = L.map('map', {scrollWheelZoom:true}).setView([31.904,35.200], 14);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap'
      }).addTo(map);

      const hint = document.getElementById("hint");
      if(activeTour){
        hint.style.display="block";
        hint.textContent = `أنت تشاهد: ${activeTour.title_ar}. فعّل خيار "عرض مسار الجولة فقط" لتصفية الخريطة.`;
      }

      document.getElementById("q").addEventListener("input", applyFilters);
      document.getElementById("tourOnly").addEventListener("change", applyFilters);


      document.getElementById("locateBtn").addEventListener("click", async ()=>{
        try{
          toast("جاري تحديد موقعك…");
          userLoc = await getUserLocation();
          toast(`تم تحديد موقعك ✅ (±${Math.round(userLoc.acc)}م)`);
          map.setView([userLoc.lat, userLoc.lng], 15, {animate:true});
          if(window._me){ window._me.remove(); window._meCircle.remove(); }
          window._me = L.marker([userLoc.lat,userLoc.lng]).addTo(map).bindPopup("موقعي الحالي");
          window._meCircle = L.circle([userLoc.lat,userLoc.lng], {radius: Math.min(120, userLoc.acc), color:'#38bdf8'}).addTo(map);
          applyFilters();
        }catch(e){
          toast("لم يتم السماح بالموقع أو تعذر تحديده.");
        }
      });

      document.getElementById("nearestBtn").addEventListener("click", ()=>{
        sortNearest = !sortNearest;
        toast(sortNearest ? "ترتيب حسب الأقرب 🧭" : "إيقاف ترتيب الأقرب");
        applyFilters();
      });

      document.getElementById("favOnly").addEventListener("change", applyFilters);
      document.getElementById("soonOnly").addEventListener("change", applyFilters);

      applyFilters();
    })();
  </script>
